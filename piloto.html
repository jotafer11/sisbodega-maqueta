<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Demo - Repuestos</title>
    <link rel="stylesheet" href="css/styles.css">   
</head>
<body>

<div class="contenedor-principal">

<div class="contenedor formulario">

    <h2>Registro de repuestos</h2>

    <form id="frmRepuesto">

        <div class="fila">
            <label>Grupo</label>

            <select id="grupo">
                <option value="">Seleccione...</option>
            </select>
        </div>

        <div class="fila">
            <label>Marca</label>

            <select id="marca">
                <option value="">Seleccione...</option>
            </select>
        </div>

        <div class="fila">
            <label>Matriz</label>

            <select id="matriz">
                <option value="">Seleccione una marca...</option>
            </select>
        </div>

        <div class="fila">
            <label>Descripción</label>

            <input
                type="text"
                id="descripcion"
                readonly
            >
        </div>

        <div class="fila">
            <label>Stock</label>

            <input
                type="number"
                id="stock"
                value="1"
                min="1"
            >
        </div>        

        <button type="submit">                   
            Guardar
        </button>

    </form>

</div>


<div class="contenedor listado">

    <h2>Listado de repuestos</h2>
<table id="tablaRepuestos">

    <thead>

        <tr>

            <th>Grupo</th>
            <th>Marca</th>
            <th>Matriz</th>
            <th>Descripción</th>
            <th>Stock</th>
            <th>Acciones</th>       

        </tr>

    </thead>

    <tbody>

    </tbody>

</table>    

</div>    


</div>




<script src="js/app.js"></script>

</body>
<div id="snackbar"></div>
</html>
