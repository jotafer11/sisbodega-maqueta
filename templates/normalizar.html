<section class="contenedor-principal">

    <div class="contenedor formulario">

        <h2>Normalizacion de repuestos</h2>

        <form id="frmRepuesto">

            <div class="fila">
                <label>Grupo</label>

                <select id="grupo">
                    <option value="">Seleccione...</option>
                </select>
            </div>

            <div class="fila">
                <label>Marca</label>

                <select id="marca">
                    <option value="">Seleccione...</option>
                </select>
            </div>

            <div class="fila">
                <label>Matriz</label>

                <select id="matriz">
                    <option value="">Seleccione una marca...</option>
                </select>
            </div>

            <div class="fila">
                <label>Producto</label>

                <input
                    type="text"
                    id="producto"
                >
            </div>            
            <input
                type="hidden"
                id="precio_venta"
            >

            <div class="fila">
                <label>Descripción</label>

                <input
                    type="text"
                    id="descripcion"
                >
            </div>

            <div class="fila">
                <label>Stock</label>

                <input
                    type="number"
                    id="stock"
                    value="1"
                    min="1"
                >
            </div>          

            <button type="submit">                   
                Guardar
            </button>
        </form>      

    </div>


    <div class="contenedor listado">

        <h2>Listado de repuestos</h2>
    <table id="tablaRepuestosN">

        <thead>

            <tr>
                <th>N° Ing</th>
                <th>Marca</th>
                <th>Matriz</th>
                <th>Producto</th>                
                <th>Descripción Interno</th>
                <th>Stock</th>
                <th>Acciones</th>       

            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>    

    </div>    


    </div>
</section>
